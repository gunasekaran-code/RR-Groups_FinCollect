name: fincollect
description: FinCollect — Loan & Collection management app (Flutter frontend).
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  intl: any
  
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  upgrader: ^13.7.0
  gal: ^2.3.3
  image: ^4.10.1
  web: ^1.1.1
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  generate: true
  
  assets:
    - assets/images/logo.png
    - assets/images/logo-splash.png
    - assets/images/logo_app_icon.png
    - assets/images/no_internet_illustration.png
    - assets/images/no_internet_tower.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo_app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"